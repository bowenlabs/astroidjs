# The Louise agents, started by a label on an issue: `agent:diagnose` posts a
# diagnosis as a comment.
# bowenlabs/claude-plugins' README, section Diagnose and fix in CI, describes
# both workflows, their secrets, and what the agents can reach.
name: Louise agents

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  diagnose:
    if: github.event.label.name == 'agent:diagnose'
    # Pinned to a commit of claude-plugins' main, not to main itself: the called
    # workflow gets the secrets below, so a change to it reaches this repository
    # only through a reviewed change to this line.
    uses: bowenlabs/claude-plugins/.github/workflows/louise-diagnose.yml@a199aa6387afd6b64548dd3dbdc1d5b206313357 # main
    with:
      agent_app_id: ${{ vars.LOUISE_AGENT_APP_ID }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      louise_token: ${{ secrets.LOUISE_REVIEW_TOKEN }}
      agent_app_private_key: ${{ secrets.LOUISE_AGENT_APP_PRIVATE_KEY }}
