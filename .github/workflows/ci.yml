name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-suffix: lint

      - name: Lint (Oxlint)
        run: corepack pnpm run lint

      # The Solid reactivity rules, which oxlint loads as a JS plugin. Scoped to
      # the component layer — they are meaningless for the config validator and
      # the generators, which are plain Node.
      - name: Lint SolidJS components (oxlint + eslint-plugin-solid)
        run: corepack pnpm run lint:solid

      - name: Format (Oxfmt)
        run: corepack pnpm run fmt:check

      - name: Dead-code check (Knip)
        run: corepack pnpm run knip

      # The repository is public, so it names no client site: not in code,
      # comments, tests, or docs. A text scan over every tracked file except the
      # CHANGELOGs; the script says why and how to add a name.
      - name: No client site names
        run: corepack pnpm run lint:names

      # Prose style for every doc and all prose in code (Markdown, MDX, and the
      # comments and JSDoc in TypeScript and JavaScript), against the Google
      # developer documentation style guide and the Louise house package
      # (louise-toolkit ADR 0013). `vale sync` fetches both packages into a
      # gitignored .vale/, pinned and reproducible rather than vendored.
      - name: Documentation style (Vale + Google)
        run: |
          corepack pnpm --package=@vvago/vale@3.17.1 dlx vale sync
          corepack pnpm run lint:docs

      # Release tooling, exercised on every PR rather than discovered at release
      # time. Nothing else in this suite loads the changesets stack, and a
      # dependency resolution that breaks it is invisible until you try to ship.
      - name: Release tooling (changesets)
        run: corepack pnpm run lint:release

  test:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-suffix: test

      - name: Type-check
        run: corepack pnpm run typecheck

      # These resolve `louise-toolkit` from node_modules — the PUBLISHED package,
      # through its real `exports` map. In the monorepo they were aliased to the
      # library's source, which meant they could pass against symbols that were
      # never publicly re-exported. A subpath that stops resolving now fails here.
      #
      # The test script runs with `--coverage`, and vitest.config.ts gates lines
      # and statements at 80%. A drop below the floor fails this step.
      - name: Test
        run: corepack pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-suffix: build

      - name: Build (dist/)
        run: corepack pnpm run build:packages

      # The same assertion `prepublishOnly` makes, run where a failure is cheap.
      - name: Every published entry point exists
        run: cd packages/astroid && node ../../scripts/ci/checks/dist-present.mjs

  docs:
    name: Build the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-suffix: docs

      # `astro build` is what surfaces a broken content collection, an unparseable
      # frontmatter block, or a link to a page that does not exist. None of those
      # are visible to Vale, which reads prose and not routing.
      - name: Build
        run: corepack pnpm run build:docs

  scaffold-smoke:
    name: Scaffold smoke — ${{ matrix.leg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `flags` go to create-astroid verbatim. The commerce legs exist because
        # the checkout route, SquareCard and the webhook receiver are only written
        # when `--commerce` is passed, so without them nothing ever compiled those
        # files — unit tests only string-match the generator output. `-multi`
        # covers the checkout route's separate multi-merchant branch.
        include:
          # `serve` boots the built scaffold and checks what only a running
          # Worker shows (scripts/ci/scaffold-serve.sh). One leg is enough: the
          # write paths and the section CSS are the same on every archetype.
          - { leg: marketing, archetype: marketing, flags: "", serve: true }
          # `--map` is the only thing that writes MapEmbed.astro, so without it
          # nothing type-checks the MapLibre worker import or its API calls.
          - { leg: marketing-map, archetype: marketing, flags: "--map" }
          - { leg: portfolio, archetype: portfolio, flags: "" }
          - { leg: storefront, archetype: storefront, flags: "" }
          - { leg: storefront-square, archetype: storefront, flags: "--commerce square" }
          - leg: storefront-square-multi
            archetype: storefront
            flags: "--commerce square --square-locations multi"
          # The editor-free app shape: a different trio, env.d.ts and layout,
          # laid over the template, so nothing else compiles them. The second
          # leg adds the modules the shape keeps; its catalog table is what
          # caught a schema missing the `JsonValue` import.
          - { leg: app, archetype: marketing, flags: "--app" }
          - leg: app-modules
            archetype: storefront
            flags: "--app --portal --pwa --commerce square"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-suffix: smoke

      # The only check that exercises packages/create-astroid/template/. Nothing
      # type-checks that tree until it is scaffolded — oxfmt, oxlint and knip are
      # all configured to skip it — so a change that breaks it passes every other
      # job and fails in a user's terminal.
      - name: Scaffold, type-check and build
        # $FLAGS unquoted on purpose: it is a space-separated flag list.
        run: scripts/ci/scaffold-smoke.sh "$ARCHETYPE" "$RUNNER_TEMP/smoke" $FLAGS
        env:
          ARCHETYPE: ${{ matrix.archetype }}
          FLAGS: ${{ matrix.flags }}

      # A write path must answer 422 for an invalid section, and reaching that
      # throw needs a real D1, so only a served scaffold shows it. The same run
      # checks that the built CSS carries the section library's utilities.
      - name: Serve the scaffold and check its write paths
        if: ${{ matrix.serve }}
        run: scripts/ci/scaffold-serve.sh "$RUNNER_TEMP/smoke/room/smoke"
        env:
          WRANGLER_SEND_METRICS: "false"

  # One required status to protect the branch with, so adding a job above does not
  # mean editing branch protection.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, test, build, docs, scaffold-smoke]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }} docs=${{ needs.docs.result }}"
          echo "smoke=${{ needs['scaffold-smoke'].result }}"
          [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" = "success" ] \
            && [ "${{ needs.docs.result }}" = "success" ] \
            && [ "${{ needs['scaffold-smoke'].result }}" = "success" ]
